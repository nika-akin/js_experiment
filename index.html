<script type="module">
import * as THREE from 'https://esm.sh/three@0.160.0';
import { OrbitControls } from 'https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js';

// --- Scene & Camera ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb); // sky blue
const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 2000);
camera.position.set(0, 200, 400);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// --- Lights ---
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight = new THREE.DirectionalLight(0xffffff, 1);
dirLight.position.set(100,200,100);
scene.add(dirLight);

// --- Controls ---
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;

// --- Load Textures (satellite RGB + grayscale DEM) ---
const loader = new THREE.TextureLoader();
Promise.all([
    loader.loadAsync('./textures/satellite.jpg'), // satellite image
    loader.loadAsync('./textures/dem.jpg')        // grayscale heightmap
]).then(([satelliteTex, demTex]) => {
    const size = 512; // grid resolution
    const geometry = new THREE.PlaneGeometry(1000, 1000, size-1, size-1);

    // read pixel data from DEM
    const canvas = document.createElement('canvas');
    canvas.width = demTex.image.width;
    canvas.height = demTex.image.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(demTex.image, 0, 0);
    const imgData = ctx.getImageData(0, 0, demTex.image.width, demTex.image.height).data;
